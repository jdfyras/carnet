name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  portable:
    # Nothing of one machine or one person may enter a public core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No absolute user path, no private address
        run: |
          if grep -rnIE '[A-Za-z]:[\\/]Users[\\/]|/home/[a-z]+/|/Users/[A-Za-z]+/' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude=ci.yml . ; then
            echo "A user path was found above." >&2
            exit 1
          fi
      - name: The notebook's own budgets hold on a fresh project
        run: |
          mkdir /tmp/vierge && cd /tmp/vierge && git init -q .
          node "$GITHUB_WORKSPACE/bin/carnet.mjs" init --fuseau UTC --agents claude,codex --appliquer
          node "$GITHUB_WORKSPACE/bin/carnet.mjs" budget
          node "$GITHUB_WORKSPACE/bin/carnet.mjs" init --verifier
